# Same checks as the local verify gate, on every push and pull request.
# Steps whose stack, tool or script is missing are skipped, so this works before the code exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node / TypeScript
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
      - name: Install (Node)
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install; fi
      - name: Type check, lint, test, build
        if: hashFiles('package.json') != ''
        run: |
          npm run typecheck --if-present
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present

      # Python
      - uses: astral-sh/setup-uv@v6
        if: hashFiles('pyproject.toml') != ''
      - name: Lint and test (Python)
        if: hashFiles('pyproject.toml') != ''
        run: |
          uv sync
          uvx ruff check .
          if [ -d tests ]; then uv run pytest -q; else echo "No tests folder yet"; fi
