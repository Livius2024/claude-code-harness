# The factory's quality gates. Hooks do not run in Claude Projects threads,
# so everything an agent must not skip lives here and in branch protection.
# Make `checks` and `acceptance` required checks on main, together with
# `owner-approval` from owner-approval.yml (docs/github-gates.md). Setup steps for a stack the repo
# does not have are skipped, so this works before the code exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tool setup only. The checks themselves are the definition of done,
      # scripts/check_done.py, the same command agents and the local Stop hook run.
      - uses: astral-sh/setup-uv@v6
        if: hashFiles('pyproject.toml') != ''
      - name: Install (Python)
        if: hashFiles('pyproject.toml') != ''
        run: uv sync

      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
      - name: Install (Node)
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install; fi

      - uses: actions/setup-go@v5
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        if: hashFiles('go.mod') != ''
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - uses: actions/setup-dotnet@v4
        if: hashFiles('*.sln', '*.slnx', '*.csproj', '*/*.sln', '*/*.slnx') != ''
        with:
          dotnet-version: "10.0.x"

      # Tests, lint, type check, build. NEVERIFICAT (exit 2) fails the job too.
      # --allow-empty only lets a repo with no code yet pass.
      - name: Definition of done
        run: python3 scripts/check_done.py --allow-empty

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_acceptance.py
