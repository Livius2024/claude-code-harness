# The factory's quality gates. Hooks do not run in Claude Projects threads,
# so everything an agent must not skip lives here and in branch protection.
# Make `checks` and `acceptance` required checks on main, together with
# `owner-approval` from owner-approval.yml (docs/github-gates.md). Steps whose stack or tool is missing are skipped,
# so this works before the code exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python
      - uses: astral-sh/setup-uv@v6
        if: hashFiles('pyproject.toml') != ''
      - name: Install (Python)
        if: hashFiles('pyproject.toml') != ''
        run: uv sync
      - name: Lint (ruff)
        if: hashFiles('pyproject.toml') != ''
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Type check (pyright)
        if: hashFiles('pyproject.toml') != ''
        run: uv run --with pyright pyright
      - name: Test (pytest)
        if: hashFiles('pyproject.toml') != ''
        run: |
          if [ -d tests ]; then uv run pytest -q; else echo "No tests folder yet"; fi

      # Node / TypeScript
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 22
      - name: Install (Node)
        if: hashFiles('package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install; fi
      - name: Type check, lint, test, build (Node)
        if: hashFiles('package.json') != ''
        run: |
          npm run typecheck --if-present
          npm run lint --if-present
          npm test --if-present
          npm run build --if-present

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_acceptance.py
