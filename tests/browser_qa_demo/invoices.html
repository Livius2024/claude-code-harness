<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Demo: facturi</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f7f7f5; color: #1f2328; }
    main { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 24px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    input, button { font: inherit; padding: 6px 8px; }
    li { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Facturi (date de test)</h1>
    <form id="add">
      <label>Număr <input name="number" required></label>
      <label>Sumă <input name="amount" required></label>
      <button type="submit">Adaugă</button>
    </form>
    <p role="status" id="status"></p>
    <ul id="list"></ul>
  </main>
  <script>
    const list = document.getElementById('list');
    async function load() {
      const invoices = await (await fetch('/api/invoices')).json();
      list.replaceChildren(...invoices.map((inv) => Object.assign(document.createElement('li'), { textContent: `${inv.number}: ${inv.amount}` })));
    }
    document.getElementById('add').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      const response = await fetch('/api/invoices', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ number: form.get('number'), amount: form.get('amount') }),
      });
      document.getElementById('status').textContent = response.ok ? 'Salvat' : 'Eroare';
      await load();
    });
    load();
    // Pages for the guard's self-test: ?call=/api/... fetches that endpoint on load.
    const call = new URLSearchParams(location.search).get('call');
    if (call) fetch(call);
  </script>
</body>
</html>
