<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Demo: TVA pe lună</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f7f7f5; color: #1f2328; }
    main { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 24px; }
    h1 { font-size: 1.4rem; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e5e5; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tfoot td { font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>TVA pe lună (date de test)</h1>
    <p>Pagina demo a fabricii, folosită ca să verifice QA în browser.</p>
    <table>
      <thead><tr><th>Luna</th><th class="num">Bază</th><th class="num">TVA 20%</th></tr></thead>
      <tbody>
        <tr><td>2026-08</td><td class="num">1 000,00</td><td class="num">200,00</td></tr>
        <tr><td>2026-09</td><td class="num">2 500,00</td><td class="num">500,00</td></tr>
      </tbody>
      <tfoot><tr><td>Total</td><td class="num">3 500,00</td><td class="num" data-testid="vat-total">700,00</td></tr></tfoot>
    </table>
  </main>
</body>
</html>
