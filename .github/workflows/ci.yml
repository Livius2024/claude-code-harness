# Checks for the harness repository itself: the starter's gate scripts and
# their tests, and the starter's workflows. Projects get their own CI from
# project-starter/.github/workflows/.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest -q

  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint all workflows (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color .github/workflows/*.yml project-starter/.github/workflows/*.yml
      - name: Validate branch-protection.json
        run: python3 -m json.tool project-starter/.github/branch-protection.json > /dev/null
      - name: Fresh starter passes its own acceptance check
        run: python3 project-starter/scripts/check_acceptance.py --root project-starter
